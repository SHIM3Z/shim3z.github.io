<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de Fondo Futurista (Deep Space) -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" /> <!-- Azul Medianoche -->
      <stop offset="50%" stop-color="#1e1b4b" /> <!-- Indigo Profundo -->
      <stop offset="100%" stop-color="#312e81" /> <!-- Violeta Oscuro -->
    </linearGradient>

    <!-- Filtro de Resplandor Intenso (Strong Glow) -->
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Trama sutil -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
        <path d="M0 4L4 0" stroke="black" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Fondo: Squircle (Cuadrado muy redondeado) -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)" />
  <rect width="512" height="512" rx="100" fill="url(#scanlines)" opacity="0.5" />
  
  <!-- Borde decorativo interno -->
  <rect x="20" y="20" width="472" height="472" rx="80" stroke="white" stroke-opacity="0.05" stroke-width="2" />

  <!-- GRUPO PRINCIPAL (Centrado y con inclinación para dinamismo) -->
  <!-- Ajusté el translate a (130, 120) para compensar el skewX -->
  <g transform="translate(130, 120) skewX(-10)">
    
    <!-- ================= CAPA GLITCH (SOMBRAS DESPLAZADAS) ================= -->
    <g opacity="0.9"> <!-- Opacidad aumentada para más visibilidad -->
        <!-- Sombra Cian (Desplazamiento mayor a la izquierda) -->
        <g transform="translate(-8, 0)">
            <!-- Letra S (Ahora Curveada) -->
            <path d="M130 40 C130 -10 30 -10 30 70 C30 150 130 110 130 190 C130 270 30 270 30 220" 
                  fill="none" stroke="#00F0FF" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Letra Z -->
            <path d="M190 0 H270 L190 250 H270" 
                  fill="none" stroke="#00F0FF" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Sombra Magenta (Desplazamiento mayor a la derecha) -->
        <g transform="translate(8, 0)">
            <!-- Letra S (Ahora Curveada) -->
            <path d="M130 40 C130 -10 30 -10 30 70 C30 150 130 110 130 190 C130 270 30 270 30 220" 
                  fill="none" stroke="#FF003C" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Letra Z -->
            <path d="M190 0 H270 L190 250 H270" 
                  fill="none" stroke="#FF003C" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
    </g>

    <!-- ================= CAPA PRINCIPAL (BLANCO PURO + GLOW) ================= -->
    <g filter="url(#strongGlow)">
        <!-- Letra S (Diseño fluido y curvo) -->
        <path d="M130 40 C130 -10 30 -10 30 70 C30 150 130 110 130 190 C130 270 30 270 30 220" 
              fill="none" stroke="white" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Letra Z (Diseño fluido recto) -->
        <path d="M190 0 H270 L190 250 H270" 
              fill="none" stroke="white" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
  </g>

</svg>